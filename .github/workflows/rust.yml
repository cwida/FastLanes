# ──────────────────────────────────────────────────────────────────────────────
# Rust CI workflow
# Builds and runs the Rust example after C++ dependencies are installed
# This file is included automatically by GitHub Actions
# ──────────────────────────────────────────────────────────────────────────────

name: Rust
run-name: >-
  ${{ github.workflow }} on ${{ github.ref_name }} (#${{ github.run_number }})
  — ${{ github.event.pull_request.title || github.event.head_commit.message }}

# ──────────────────────────────────────────────────────────────────────────────
# Events
# ──────────────────────────────────────────────────────────────────────────────
on:
  push:
  pull_request:

# ──────────────────────────────────────────────────────────────────────────────
# Jobs
# ──────────────────────────────────────────────────────────────────────────────
jobs:
  build:
    runs-on: ubuntu-latest

    # ──────────────────────────────────────────────────────────────────────────
    # Steps
    # ──────────────────────────────────────────────────────────────────────────
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Detect CPU count
        shell: bash
        run: |
          # this prints BUILD_THREADS=<n>
          make detect-cpu | tee -a "$GITHUB_ENV"

      - name: Install LLVM
        uses: ./.github/actions/install-llvm

      - name: Install C++ deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential pkg-config

      - name: Build & run Rust example
        run: |
          # now BUILD_THREADS is set in the env
          make -j $BUILD_THREADS run-rust-example
