name: CI
run-name: "${{ github.actor }} – ${{ github.event.head_commit.message }}"

# ──────────────────────────────────────────────────────────────────────────────
# Events
# ──────────────────────────────────────────────────────────────────────────────
on:
  push:
  pull_request:
    branches: [ "main", "dev" ]

# Cancel in-flight runs on the same branch/PR so we do not waste minutes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Global env (tweak once, use everywhere)
env:
  CMAKE_GENERATOR: Ninja            # much faster than Makefiles
  BUILD_THREADS: 12                 # tweak to fit runner vCPU count

