  # ──────────────────────────────────────────────────────────────────────────────
  # 5️⃣  Example build & run
  # ──────────────────────────────────────────────────────────────────────────────
  example:
    #    needs: build
    strategy:
      matrix:
        platform: [ ubuntu-latest, macos-latest ]
        build_type: [ Release ]
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache example build
        uses: actions/cache@v4
        with:
          path: build_${{ matrix.build_type }}
          key: ${{ runner.os }}-example-${{ matrix.build_type }}-${{ hashFiles('CMakeLists.txt', '**/*.cmake', '**/*.[ch]pp', '**/*.h') }}
          restore-keys: |
            ${{ runner.os }}-example-${{ matrix.build_type }}-

      - name: Configure example
        run: |
          cmake -S ${{ github.workspace }} \
                -B build_${{ matrix.build_type }} \
                -DFLS_BUILD_EXAMPLE=ON \
                -DFLS_ENABLE_CLANG_TIDY=OFF \
                -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
                -DCMAKE_C_COMPILER=clang \
                -DCMAKE_CXX_COMPILER=clang++

      - name: Build example
        run: cmake --build build_${{ matrix.build_type }} -j $BUILD_THREADS

      - name: Run cpp_example
        run: build_${{ matrix.build_type }}/examples/cpp_example

  # ──────────────────────────────────────────────────────────────────────────────
  # 6️⃣  Tests (Linux Release)
  # ──────────────────────────────────────────────────────────────────────────────
  test:
    needs: example
    runs-on: ubuntu-latest
    env:
      build_type: Release

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache test build
        uses: actions/cache@v4
        with:
          path: test_build_${{ env.build_type }}
          key: ${{ runner.os }}-tests-${{ env.build_type }}-${{ hashFiles('CMakeLists.txt', '**/*.cmake', '**/*.[ch]pp', '**/*.h') }}
          restore-keys: |
            ${{ runner.os }}-tests-${{ env.build_type }}-

      - name: Configure tests
        run: |
          cmake -S ${{ github.workspace }} \
                -B test_build_${{ env.build_type }} \
                -DFLS_BUILD_TESTING=ON \
                -DCMAKE_BUILD_TYPE=${{ env.build_type }} \
                -DCMAKE_C_COMPILER=clang \
                -DCMAKE_CXX_COMPILER=clang++

      - name: Build tests
        run: cmake --build test_build_${{ env.build_type }} -j $BUILD_THREADS

      - name: Run tests
        working-directory: test_build_${{ env.build_type }}
        run: ctest -j $BUILD_THREADS --stop-on-failure --output-on-failure --timeout 5000
